<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Rawi</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <div class="environment" aria-hidden="true"></div>
  <div class="window">
  <header class="bar toolbar">
    <div class="bar-inner">
      <h1>Rawi</h1>
      <div id="status" class="status" role="status" data-health="checking">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-label">Checking…</span>
      </div>
    </div>
  </header>

  <main id="messages" aria-live="polite" aria-label="Conversation">
    <p class="system-message" id="empty-hint">Talk to me in English, الدارجة, المصري or السعودي.</p>
  </main>
  </div>

  <footer class="bar bottom-bar ornament">
    <form id="ask-form" class="bar-inner" autocomplete="off">
      <input id="question" type="text" name="question" placeholder="Type a question…" aria-label="Question" enterkeyhint="send" maxlength="2000">
      <button id="mic" class="mic" type="button" data-state="idle" aria-label="Ask by voice">
        <svg class="icon icon-mic" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <svg class="icon icon-spin" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="34 60"/>
        </svg>
        <svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6.5" y="6.5" width="11" height="11" rx="2.5" fill="currentColor"/>
        </svg>
      </button>
    </form>
  </footer>
  <div class="grabber" aria-hidden="true"></div>
</body>
</html>
